.hbg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(248,246,240,.92) 0%,rgba(248,246,240,.62) 34%,rgba(248,246,240,.12) 68%,rgba(248,246,240,0) 100%),linear-gradient(0deg,var(--bg) 0%,transparent 22%),linear-gradient(135deg,rgba(47,75,138,.16),rgba(47,128,104,.1))}
@keyframes kb{to{transform:scale(1.08)}}@keyframes hbi{from{opacity:0}}
.tile{min-height:178px;justify-content:space-between}.tile h4{font-size:20px}
.hint{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--a)}.hint .i{width:14px;height:14px;transition:transform .3s}.tile:hover .hint .i{transform:translateX(5px)}.ht{display:none}
.tile>.rev{position:absolute;inset:0;padding:24px;background:linear-gradient(150deg,var(--a),var(--b));color:#fff;display:flex;flex-direction:column;justify-content:center;gap:8px;clip-path:inset(100% 0 0 0);transition:clip-path .5s cubic-bezier(.2,.8,.2,1);border-radius:24px}
.tile .rev h4{font-size:17px;color:#fff}.tile .rev p{color:#fff;font-size:14px;flex:none}.tile .rev .x{font-size:13px;opacity:.85}.tile .rev a{color:#fff;margin-top:4px;border-bottom:1px solid rgba(255,255,255,.5);align-self:flex-start;padding-bottom:2px}
.tile:hover>.rev,.tile:focus-within>.rev,.tile.open>.rev{clip-path:inset(0)}
@media(hover:none){.hh{display:none}.ht{display:inline}}
@media(max-width:760px){.hbg:before{background-position:70% center}.hbg:after{background:linear-gradient(180deg,rgba(248,246,240,.9) 0%,rgba(248,246,240,.7) 42%,rgba(248,246,240,.3) 75%,rgba(248,246,240,.1)),linear-gradient(0deg,var(--bg),transparent 18%)}}
.emg{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;margin-top:40px;border-radius:999px}.emg b{color:var(--a)}
.live{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;margin-top:16px}.dt{width:9px;height:9px;border-radius:50%;background:#c4574a}.dt.on{background:#2fa36b;animation:pu2 1.8s infinite}@keyframes pu2{70%{box-shadow:0 0 0 9px transparent}0%{box-shadow:0 0 0 0 rgba(47,163,107,.55)}}
.fd{display:flex;flex-wrap:wrap;gap:12px}.ch{border:0;cursor:pointer;font:600 15px inherit;font-family:inherit;padding:14px 22px;border-radius:999px;color:var(--tx);transition:transform .25s,background .25s}.ch:hover{transform:translateY(-3px)}.ch.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.res{margin-top:18px;padding:24px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;animation:in .5s}.res span{color:var(--mut);flex:1;min-width:200px}
.ba{position:relative;height:300px;overflow:hidden;--p:50%}.bl,.br{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.bl{background:linear-gradient(135deg,#e6e1d2,#f4f1e8)}.br{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;clip-path:inset(0 0 0 var(--p))}
.bh{position:absolute;top:0;bottom:0;left:var(--p);width:3px;background:#fff;box-shadow:0 0 14px rgba(0,0,0,.3);pointer-events:none}.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize}
.fm{padding:30px;display:grid;gap:12px;align-content:start}.fm input,.fm select,.fs{font:inherit;padding:14px 16px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.7);color:var(--tx);width:100%}.fs{margin-bottom:16px;border-radius:999px}
.two.eq{grid-template-columns:1fr 1fr;align-items:stretch}
.mdl{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(34,52,92,.35);backdrop-filter:blur(8px);animation:in .3s}.mc{position:relative;max-width:480px;width:100%;padding:34px;display:grid;gap:10px;max-height:86vh;overflow:auto}.mc p{color:var(--mut)}.mc ol{padding-left:20px;color:var(--mut);display:grid;gap:4px}.mc .btn{justify-self:start;margin-top:8px}
.xb{position:absolute;top:12px;right:14px;border:0;background:none;font-size:26px;cursor:pointer;color:var(--mut)}
.abar{display:none}
.asb{position:fixed;right:18px;bottom:22px;z-index:30;border:0;cursor:pointer;font:600 14px inherit;font-family:inherit;color:var(--tx);padding:14px 22px;border-radius:999px}
.asp{position:fixed;right:18px;bottom:82px;z-index:31;width:min(320px,90vw);padding:22px;border-radius:24px;display:grid;gap:12px;animation:in .3s}.asp div{display:flex;flex-wrap:wrap;gap:8px}.asp button{border:1px solid var(--bd);background:rgba(255,255,255,.8);border-radius:999px;padding:8px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer;color:var(--tx)}.asp p{color:var(--mut);font-size:14px}.asp a{color:var(--a);font-weight:600}
.pop{position:fixed;left:50%;top:90px;translate:-50% 0;z-index:70;width:min(420px,92vw);padding:26px 30px;display:grid;gap:10px;animation:in .4s}.pop span{color:var(--mut)}.pop .btn{justify-self:start}
.cur{position:fixed;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:1.5px solid var(--a);background:rgba(255,255,255,.25);backdrop-filter:blur(3px);z-index:90;pointer-events:none;transition:width .25s,height .25s,margin .25s,background .25s}.cur.big{width:56px;height:56px;margin:-28px 0 0 -28px;background:rgba(47,128,104,.15)}
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#fff,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none;animation:ix 2.8s ease forwards}
#intro .lg{width:clamp(110px,22vw,150px);overflow:visible}
#intro .tt{fill:rgba(47,128,104,0);stroke:url(#lgx);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s .2s cubic-bezier(.6,0,.2,1) forwards,fl3 .6s 1.2s forwards}
#intro .pp{fill:none;stroke:#2f8068;stroke-width:3.2;stroke-linecap:round;transform-origin:50px 55px;animation:pp .7s .9s cubic-bezier(.3,1.6,.5,1) backwards}#intro .pp circle{fill:#2f8068}
.wm{display:flex;align-items:flex-start;font-size:clamp(30px,7vw,52px);font-weight:800;letter-spacing:.08em;color:var(--navy)}.wm span{display:inline-block;animation:lu .6s calc(1s + var(--i)*.07s) backwards cubic-bezier(.2,.8,.2,1)}.wm sup{font-size:.55em;color:var(--teal);margin-left:.1em;animation:lu .6s 1.5s backwards cubic-bezier(.2,.8,.2,1)}
.ld{width:140px;height:3px;border-radius:3px;background:rgba(47,75,138,.15);overflow:hidden;position:relative}.ld:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--teal),var(--navy));transform:translateX(-100%);animation:ldp 2s .3s ease-in-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fl3{to{fill:rgba(47,128,104,.1)}}@keyframes pp{from{opacity:0;transform:scale(.3)}}@keyframes lu{from{opacity:0;transform:translateY(24px)}}@keyframes ldp{to{transform:none}}
@keyframes ix{0%,82%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.04);visibility:hidden}}
@media(prefers-reduced-motion:reduce){#intro{display:none}}
#app.out{opacity:0;transform:scale(.96);filter:blur(10px);transition:.32s}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.6);width:10px;height:10px;translate:-50% -50%;animation:rp .6s ease-out forwards;pointer-events:none}@keyframes rp{to{scale:30;opacity:0}}
.hero>div:first-child{translate:0 calc(var(--sy,0)*-.1px)}.vis{translate:0 calc(var(--sy,0)*.06px)}
:focus-visible{outline:3px solid var(--a);outline-offset:3px}
@media(max-width:1100px){.nv .logo{display:none}.sb .dx{display:none}.sb .mx{display:inline}}

.cph{height:240px}.por img{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}.por:hover img{transform:scale(1.05)}.por img+small{left:50%;translate:-50% 0;bottom:14px;padding:7px 16px;border-radius:999px;color:var(--tx);background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-weight:600;font-size:12px;white-space:nowrap;border:1px solid var(--bd)}

h:"Confident smiles, beautifully crafted.",l:"Cosmetic and implant dentistry led by Dr. Parag Shah, in a calm, comfortable clinic in Ghatkopar East.",
m:"Hello Dr. Parag Shah, I would like to book a dental appointment at Physio 32, Ghatkopar. Please let me know the available slots.",
em:"parag.bds@gmail.com",hr:"9:30 am to 8:30 pm",hs:"9:30–8:30",hc:"Open 9:30 am – 8:30 pm",ho:[[570,1230]],ts:[["09:30","9:30 am"],["11:00","11:00 am"],["12:30","12:30 pm"],["14:00","2:00 pm"],["16:00","4:00 pm"],["17:30","5:30 pm"],["19:00","7:00 pm"]],fd:[["Missing tooth","Dental Implants"],["Stained teeth","Teeth Whitening"],["Crooked or gapped teeth","Braces & Aligners"],["Tooth pain","Root Canal Treatment"],["Bleeding gums","Scaling & Gum Care"],["I want a better smile","Smile Designing"]],tp:[["Brush twice a day","Two minutes each time with a soft brush and fluoride toothpaste."],["Do not skip flossing","Cleaning between teeth protects your gums and prevents cavities."],["Do not ignore bleeding gums","Bleeding that continues is a sign to book a check-up."],["Regular check-ups","A routine visit every six months helps catch problems early."]],

sv:[["Dental Implants","A permanent, natural-looking replacement for missing teeth.","Ideal for one or several missing teeth. Restores chewing strength and helps protect the jawbone."],["Cosmetic Dentistry","Treatments that refine shape, colour and alignment of your smile.","Covers veneers, bonding and contouring to fix chips, gaps and uneven teeth."],["Smile Designing","A planned makeover built around your face and personality.","A custom plan based on your face shape, lip line and the look you want."],["Teeth Whitening","Safe, professional whitening for visibly brighter teeth.","Removes tea, coffee and everyday stains for a fresher, brighter smile."],["Root Canal Treatment","Careful, comfortable treatment that saves a damaged tooth.","Relieves tooth pain and infection while keeping your natural tooth."],["Braces & Aligners","Straighter teeth and a better bite for teens and adults.","Options for children, teens and adults, from metal braces to clear aligners."],["Crowns, Bridges & Dentures","Durable restorations that restore chewing and confidence.","Replace or protect damaged and missing teeth with custom-made restorations."],["Scaling & Gum Care","Deep cleaning and gum treatment for long-term oral health.","Helps prevent bleeding gums, bad breath and gum disease."]],
ab:["Dr. Parag Shah is a dental surgeon (BDS) with a special focus on cosmetic and implant dentistry.","At Physio 32 he takes time to explain every option, so you understand your treatment, the steps involved and the result you can expect before anything begins.","The clinic shares its space with a physiotherapy practice run by Dr. Lajja Shah, so families can get dental and physical care under one roof."],
fq:[["How do I book an appointment?","Tap any Book button to message the clinic on WhatsApp. The team will confirm a suitable slot with you."],["What are the clinic timings?","OPD hours are 9:30 am to 8:30 pm."],["Can I consult the physiotherapist as well?","Yes. Dr. Lajja Shah practises physiotherapy at the same clinic. Use the Switch button at the top to see her services."],["Where is the clinic?","Ground Floor, Amar Smruti, 60 Feet Road, R.B. Mehta Marg, Ghatkopar (East), Mumbai 400077."]]},

em:"lajjshah@gmail.com",hr:"10:00 am to 2:00 pm and 5:00 pm to 8:00 pm",hs:"10–2 · 5–8",hc:"Open 10 am – 2 pm · 5 – 8 pm",ho:[[600,840],[1020,1200]],ts:[["10:00","10:00 am"],["11:00","11:00 am"],["12:00","12:00 pm"],["13:00","1:00 pm"],["17:00","5:00 pm"],["18:00","6:00 pm"],["19:00","7:00 pm"]],cr:["Certified Dry Needling Therapist","Certified Kinesio Taping Therapist","Certified Neurokinetic Therapist","Certified ANC & PNC Therapist","Certified IASTM Therapist","Certified DZMR Therapist"],fd:[["Neck or back","Back, Neck & Joint Pain"],["Shoulder, knee or hip","Back, Neck & Joint Pain"],["Sports injury","Sports Injury Rehab"],["After surgery or fracture","Post-Surgery Rehab"],["Poor posture","Posture & Ergonomics"],["Flat feet or foot pain","Foot Analysis"],["Care for a senior citizen","Geriatric Care"]],tp:[["Move every 45 minutes to 1 hour","Stand up and stretch during long hours of sitting."],["Screen at eye level","Raise your monitor or phone to keep your neck neutral."],["Warm up first","A few minutes of mobility work lowers the risk of injury."],["Get pain assessed early","Pain lasting more than a few days is worth an assessment."]],
cd:["Back pain","Neck pain","Sciatica","Frozen shoulder","Knee pain","Ligament injuries","Fracture recovery","Poor posture","Flat feet","Facial paralysis","Jaw pain","Post-pregnancy therapy","Headaches"],
sv:[["Back, Neck & Joint Pain","Assessment-led treatment for spine and joint pain, stiffness, disc problems and arthritis.","Helps with sciatica, neck and back pain, and arthritis in the knees, hips, shoulders and hands."],["Sports Injury Rehab","Structured recovery to return to play strong and safely.","Covers sprains, strains and ligament injuries, with a safe plan to return to sport."],["Post-Surgery Rehab","Guided rehabilitation after fractures and joint or spine surgery.","Restores strength and movement after knee, hip, shoulder, spine or fracture surgery."],["Posture & Ergonomics","Correct desk-job and lifestyle strain before it turns into pain.","Workstation advice and corrective exercises for neck, shoulder and back strain."],["Manual Therapy","Hands-on techniques that ease pain and restore joint movement.","Hands-on mobilisation and soft-tissue work to relieve pain and free up movement."],["Exercise Therapy","Customised exercise programmes you can continue at home.","Strengthening and mobility routines tailored to you, with a plan to follow at home."],["Geriatric Care","Gentle, safe physiotherapy designed for senior citizens.","Improves balance, strength and mobility to support independent daily living and lower the risk of falls."],["Foot Analysis","A detailed assessment of your foot posture and the way you walk.","Helps identify flat feet and other foot problems that can lead to foot, knee or back pain."]],
ab:["Dr. Lajja Shah is a qualified physiotherapist holding BPTH and MPTH degrees, with CMP and MIAP credentials.","Every plan starts with a thorough assessment, followed by hands-on treatment and an exercise programme built around your condition, routine and goals.","The clinic shares its space with a dental practice run by Dr. Parag Shah, so the whole family can be cared for in one place."],
fq:[["How do I book an appointment?","Tap any Book button to message the clinic on WhatsApp. The team will confirm a suitable slot with you."],["What are the clinic timings?","OPD hours are 10:00 am to 2:00 pm and 5:00 pm to 8:00 pm."],["Do I need a doctor’s referral?","Please ask when you message the clinic. Bring any previous reports or scans to your first visit."],["Can I also see the dentist?","Yes. Dr. Parag Shah practises dentistry at the same clinic. Use the Switch button at the top to see his services."]]}};
